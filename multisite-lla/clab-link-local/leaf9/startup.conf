! Startup-config
! device: leaf9 (cEOSLab, EOS-4.35.1F-45319759.4351F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$RBgB9OqZS9N5e1Sg$Ru8DtqAEMTXBGfFkCYSkkvZpQAcA7KnHOOeHVX8T0JgrkaAibRbPIB54ZY9l/FUEWcGFkrjsQ2k8Z7NXJf418/
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname leaf9
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 1300
   name tenant-c
!
vrf instance tenant-c
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   mtu 9214
   no switchport
   ipv6 enable
!
interface Ethernet2
   mtu 9214
   no switchport
   ipv6 enable
!
interface Loopback0
   ip address 192.168.2.3/32
   ipv6 address 2001::4898:192:168:2:3/128
!
interface Management0
   ip address 172.20.30.119/24
!
interface Vlan1300
   no autostate
   vrf tenant-c
   ip address 10.20.2.1/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vrf tenant-c vni 300
!
ip routing ipv6 interfaces 
ip routing vrf tenant-c
!
ipv6 unicast-routing
ipv6 unicast-routing vrf tenant-c
!
ip route 0.0.0.0/0 172.20.30.1
!
router bgp 64662
   router-id 192.168.2.3
   no bgp default ipv4-unicast
   neighbor SS-EVPN peer group
   neighbor SS-EVPN update-source Loopback0
   neighbor SS-EVPN ebgp-multihop
   neighbor SS-EVPN send-community extended
   neighbor spine-lla peer group
   neighbor spine-lla route-map default-spine-lla-v4-in in
   neighbor spine-lla route-map default-spine-lla-v4-out out
   neighbor spine-lla send-community standard extended
   neighbor 192.168.0.5 peer group SS-EVPN
   neighbor 192.168.0.5 remote-as 64665
   neighbor 192.168.0.5 allowas-in 2
   neighbor 192.168.0.6 peer group SS-EVPN
   neighbor 192.168.0.6 remote-as 64665
   neighbor 192.168.0.6 allowas-in 2
   neighbor interface Et1-2 peer-group spine-lla remote-as 64661
   !
   address-family evpn
      neighbor SS-EVPN activate
   !
   address-family ipv4
      neighbor spine-lla activate
      neighbor spine-lla next-hop address-family ipv6 originate
      network 192.168.2.3/32
   !
   address-family ipv6
      neighbor spine-lla activate
      network 2001::4898:192:168:2:3/128
   !
   vrf tenant-c
      rd 192.168.2.3:100
      route-target import evpn 64665:300
      route-target export evpn 64665:300
      router-id 192.168.2.3
      network 10.20.2.0/24
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end
